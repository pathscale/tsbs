[package]
name = "tsbs-worktable"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "tsbs_run_worktable"
path = "src/main.rs"

[dependencies]
derive_more = { version = "2.0.1", features = ["from", "error", "display", "debug", "into"] }
eyre = "0.6"
futures = "0.3"
rkyv = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
uuid = "1"
worktable = "=0.9.4"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
